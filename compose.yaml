services:
  db:
    image: postgres:16-alpine
    container_name: jw-reminders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jw_reminders}
      POSTGRES_USER: ${POSTGRES_USER:-jw_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jw_admin} -d ${POSTGRES_DB:-jw_reminders}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jw-reminders-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jw_admin}:${POSTGRES_PASSWORD}@jw-reminders-db:5432/${POSTGRES_DB:-jw_reminders}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: "4000"
      WHATSAPP_API_URL: http://jw-reminders-whatsapp:3010
      WHATSAPP_INTERNAL_TOKEN: ${WHATSAPP_INTERNAL_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TEST_MODE: ${TEST_MODE:-true}
      TEST_PHONE: ${TEST_PHONE:-5219611234567}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jw-reminders-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://jw-reminders-api:4000
      NODE_ENV: production
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: jw-reminders-worker
    restart: unless-stopped
    init: true
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jw_admin}:${POSTGRES_PASSWORD}@jw-reminders-db:5432/${POSTGRES_DB:-jw_reminders}
      WHATSAPP_API_URL: http://jw-reminders-whatsapp:3010
      WHATSAPP_INTERNAL_TOKEN: ${WHATSAPP_INTERNAL_TOKEN}
      CRON_SCHEDULE: "*/10 * * * *"
      TEST_MODE: ${TEST_MODE:-true}
      TEST_PHONE: ${TEST_PHONE:-5219611234567}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  whatsapp:
    build:
      context: .
      dockerfile: apps/whatsapp/Dockerfile
    container_name: jw-reminders-whatsapp
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    mem_limit: 1500m
    mem_reservation: 512m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jw_admin}:${POSTGRES_PASSWORD}@jw-reminders-db:5432/${POSTGRES_DB:-jw_reminders}
      PORT: "3010"
      WHATSAPP_SESSION_PATH: /app/apps/whatsapp/.wwebjs_auth
      WHATSAPP_INTERNAL_TOKEN: ${WHATSAPP_INTERNAL_TOKEN}
      NODE_ENV: production
    volumes:
      - whatsapp_session:/app/apps/whatsapp/.wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  whatsapp_session:
